# Benchmark configuration for Valkey/Redis Cluster (see also valkey-cluster.toml).
#
# Uses CLUSTER SLOTS to discover topology at startup and routes keys by CRC16
# hash slot. See docs/guide.md#cluster-mode for what MOVED and ASK do.

[general]
duration = "60s"
warmup = "10s"
threads = 4

[target]
# Seed nodes — only one needs to be reachable for topology discovery.
endpoints = ["127.0.0.1:7000"]
protocol = "resp"
cluster = true

[connection]
connections = 16
pipeline_depth = 32

[workload]
prefill = true

[workload.keyspace]
count = 1_000_000

[workload.commands]
get = 80
set = 20
